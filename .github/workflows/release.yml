# The Release: on a `v*` tag (`npm version`'s, never a push to `main`), make
# the Draft release, then run both Platform builds into it. A full draft holds
# five files: the Installer, `latest.yml` and its blockmap from the Windows
# leg, the AppImage and `latest-linux.yml` from the Linux leg. Publishing the
# draft after the Package smoke is the release (docs/release-checklist.md,
# sections 10 and 11). The token is the workflow's own and goes to
# electron-builder's upload only; nothing is baked into the Installer or the
# AppImage.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # electron-builder uploads each file concurrently, and each upload that finds
  # no release creates its own: two drafts for one tag (issue #284). Made here
  # first, once for both legs, every upload finds it; a re-run finds the one
  # already there.
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the Draft release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # One Platform build per runner. A leg that fails leaves the other to finish,
  # so a re-run rebuilds only what is missing from the draft.
  package:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Full history: the frozen-handoff tests diff against the commit that
      # brought each handoff in (issue #510).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc -b tsconfig.json

      - name: Test
        run: node node_modules/vitest/vitest.mjs run

      - name: Package and upload to the Draft release
        run: node electron/scripts/packageApp.mjs --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
