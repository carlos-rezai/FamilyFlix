<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="tokens.css" />
      </helmet>
      <div style="{{ rootStyle }}">
        <!-- ============================= BROWSE ============================= -->
        <sc-if value="{{ isBrowse }}" hint-placeholder-val="{{ true }}">
          <dc-import
            name="page.LibraryPage"
            lib="{{ libModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= GENRE OVERVIEW ============================= -->
        <sc-if value="{{ isGenre }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.GenrePage"
            genre="{{ genreModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= DETAIL ============================= -->
        <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.MoviePage"
            detail="{{ detailModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= PLAYER ============================= -->
        <sc-if value="{{ isPlayer }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="feat.PlayerControls"
            p="{{ playerModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= ADD MOVIE ============================= -->
        <sc-if value="{{ isAdd }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="feat.MovieForm"
            form="{{ formModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= IMPORT ============================= -->
        <sc-if value="{{ isImport }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="feat.ImportFlow"
            imp="{{ importModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= SERIES ============================= -->
        <sc-if value="{{ isSeries }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.SeriesPage"
            sr="{{ seriesModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= SEASON ============================= -->
        <sc-if value="{{ isSeason }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.SeasonPage"
            sn="{{ seasonModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= TMDB ENRICHMENT ============================= -->
        <sc-if value="{{ isEnrich }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="feat.EnrichmentFlow"
            en="{{ enrichModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= SETTINGS ============================= -->
        <sc-if value="{{ isSettings }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.SettingsPage"
            settings="{{ settingsModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= EXPORT MODAL (feat.ExportModal) ============================= -->
        <sc-if value="{{ exportOpen }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="feat.ExportModal"
            data="{{ exportModel }}"
            style="position: absolute; inset: 0; z-index: 90"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= SNACKBAR HOST ============================= -->
        <sc-if value="{{ hasSnackbars }}" hint-placeholder-val="{{ false }}">
          <div
            style="
              position: absolute;
              right: 24px;
              bottom: 24px;
              z-index: 200;
              display: flex;
              flex-direction: column-reverse;
              gap: 12px;
              align-items: flex-end;
              pointer-events: none;
            "
          >
            <sc-for list="{{ snackbars }}" as="n" hint-placeholder-count="1">
              <div style="pointer-events: auto">
                <dc-import
                  name="mol.Snackbar"
                  variant="{{ n.variant }}"
                  title="{{ n.title }}"
                  message="{{ n.message }}"
                  action-label="{{ n.actionLabel }}"
                  on-action="{{ n.action }}"
                  dismissible="{{ n.dismissible }}"
                  on-dismiss="{{ n.onDismiss }}"
                  hint-size="360px,80px"
                ></dc-import>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </x-dc>

        componentDidMount(){
          this._updateTimer = setTimeout(()=>this.offerUpdate(), 1600);
          this.timer = setInterval(()=>{
            const s=this.state;
            if(s.screen==='player'){
              const dur=this.durationOf(); const patch={};
              if(s.playing && s.currentTime<dur) patch.currentTime=Math.min(dur,s.currentTime+0.25);
              if(s.playing && Date.now()-this.lastMove>3000 && s.controlsVisible) patch.controlsVisible=false;
              if(s.playingEp && s.playing && dur>0 && s.currentTime>=dur-0.3){ this.playNextEpisode(); return; }
              if(Object.keys(patch).length) this.setState(patch);
            } else if(s.screen==='enrich' && s.enStep==='running'){
              const done=Math.min(s.enTotal, s.enDone + (1+Math.floor(Math.random()*3)));
              const item=this.fakeTitle(done+3);
              let kind='success', text='✓ Matched   '+item;
              const r=Math.random();
              if(r<0.08){ kind='warning'; text='⚠ '+item+' — several possible matches'; }
              else if(r<0.12){ kind='warning'; text='⚠ '+item+' — no result on TMDB'; }
              else if(r<0.2){ kind='scan'; text='↓ poster.jpg  →  '+this.fakePath(s.impRoot, done+3); }
              const log=this.appendLog(s.enLog, {text, kind});
              if(done>=s.enTotal){
                const pend=this.seedEnrichPending();
                this.setState({enDone:s.enTotal, enStep:'review', enMatched:s.enTotal-pend.length, enPending:pend, enrichedCount:s.enrichedCount+(s.enTotal-pend.length), lastSync:'just now',
                  enLog:this.appendLog(log, {text:'✓ Sync complete — '+(s.enTotal-pend.length)+' enriched, '+pend.length+' need a decision.', kind:'success'})});
              } else {
                this.setState({enDone:done, enCurrent:item, enLog:log});
              }
            } else if(s.screen==='import' && s.impStep==='running'){
              if(s.impPhase==='scan'){
                const target=1240;
                const found=Math.min(target, s.impFound + (40+Math.floor(Math.random()*95)));
                const path=this.fakePath(s.impRoot, found);
                const log=this.appendLog(s.impLog, {text:'Scanning   '+path, kind:'scan'});
                if(found>=target){
                  this.setState({impFound:target, impTotal:target, impPhase:'import', impCurrent:'',
                    impLog:this.appendLog(log, {text:'✓ Found '+target.toLocaleString()+' movies across '+s.impFound.toLocaleString()+' folders. Starting import…', kind:'success'})});
                } else {
                  this.setState({impFound:found, impCurrent:path, impLog:log});
                }
              } else {
                const done=Math.min(s.impTotal, s.impDone + (28+Math.floor(Math.random()*42)));
                const item=this.fakeTitle(done);
                let kind='success', text='✓ Imported   '+item;
                const r=Math.random();
                if(r<0.07){ kind='warning'; text='⚠ '+item+' — no subtitle track found'; }
                else if(r<0.10){ kind='warning'; text='⚠ '+item+' — multiple folder matches'; }
                const log=this.appendLog(s.impLog, {text, kind});
                if(done>=s.impTotal){
                  const probs=this.seedProblems();
                  this.setState({impDone:s.impTotal, impStep:'review', impMatched:s.impTotal-probs.length, impProblems:probs,
                    impLog:this.appendLog(log, {text:'✓ Import complete — '+(s.impTotal-probs.length).toLocaleString()+' imported, '+probs.length+' need attention.', kind:'success'})});
                } else {
                  this.setState({impDone:done, impCurrent:item, impLog:log});
                }
              }
            }
          },220);
        }
        componentWillUnmount(){ clearInterval(this.timer); }

        // ---- helpers ----
        eff(m){ return this.state.overrides[m.id]!=null ? this.state.overrides[m.id] : m.st; }
        durationOf(){ const ep=this.state.playingEp; if(ep) return ep.runtime*60; const m=this.cur(); return m? m.runtime*60 : 0; }
        cur(){ return this.rawMovies.find(m=>m.id===this.state.selectedId)||null; }
        fmtClock(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=sec%60; const p=n=>String(n).padStart(2,'0'); return h>0?`${h}:${p(mm)}:${p(ss)}`:`${mm}:${p(ss)}`; }
        posterStyleOf(m){ return {position:'absolute',inset:0,background:`linear-gradient(155deg, ${m.g1} 0%, ${m.g2} 100%)`}; }
        ratingOf(m){ return this.ratings[m.id]!=null ? this.ratings[m.id] : 0; }
        starParts(pct,size){ return {
          wrapStyle:{position:'relative',display:'inline-block',fontSize:size+'px',lineHeight:1,letterSpacing:Math.round(size*0.14)+'px',flex:'0 0 auto',whiteSpace:'nowrap'},
          fillStyle:{position:'absolute',left:0,top:0,height:'100%',width:Math.max(0,Math.min(100,pct))+'%',overflow:'hidden',color:'var(--color-accent)',whiteSpace:'nowrap'},
        }; }
        starText(pct){ return (Math.round(pct/20*2)/2).toFixed(1); }
        view(m){ const e=this.eff(m); return {
          id:m.id,title:m.title,year:m.year,genres:m.genres,topTag:m.genres[0]+' · '+m.year,

              playPauseIcon:playIcon, volumeIcon:volIcon, subBtnStyle:subBtn, hasSubs,
              showNextEp:!!nextEp && !s.autoNextCancelled && dur>0 && (dur-ct)<=15,
              nextCountdown:Math.max(0,Math.ceil(dur-ct)),
              nextEpLabel: nextEp ? ('S'+String(nextEp.season).padStart(2,'0')+'E'+String(nextEp.number).padStart(2,'0')) : '',
              nextEpTitle: nextEp ? nextEp.title : '',
              nextThumbStyle: nextEp ? {flex:'0 0 auto',width:'104px',aspectRatio:'16 / 9',borderRadius:'7px',background:'linear-gradient(150deg, '+nextEp.g1+' 0%, '+nextEp.g2+' 100%)'} : {},
              onPlayNext:()=>this.playNextEpisode(), onCancelNext:()=>this.cancelAutoNext(),
              showBigPlay:!s.playing, showSubtitle:s.subsOn && hasSubs,
              subtitleLine:'— You can see the whole coast from up here.',
            },
            // add
            formModel:{
              inImportContext:s.addContext==='import', resolveLabel:s.fTitle,
              heading:s.addContext==='edit'?'Edit details':'Add a movie',
              labelStyle, inputStyle, textareaStyle,
              title:s.fTitle, year:s.fYear, onTitle:(e)=>this.onFTitle(e), onYear:(e)=>this.onFYear(e),
              director:s.fDirector, cast:s.fCast, description:s.fDescription, onDirector:(e)=>this.onFDirector(e), onCast:(e)=>this.onFCast(e), onDescription:(e)=>this.onFDescription(e),
              genreChips,
              rating:s.fRating, onRating:(p)=>this.setFRating(p),
              video:s.fVideo, poster:s.fPoster, pickVideo:()=>this.pickVideo(), pickPoster:()=>this.pickPoster(), removeVideo:()=>this.removeVideo(), removePoster:()=>this.removePoster(),
              addSub:()=>this.addSub(), subtitles:subRows, langOptions:this.langPool,
              onSave:()=>this.saveMovie(), onBack:()=>this.backFromAdd(),
              saveLabel:s.addContext==='import'?'Save & continue':s.addContext==='edit'?'Save changes':'Add to library',
              cancelLabel:s.addContext==='import'?'Skip this one':'Cancel',
            },
            // import
            importModel:(()=>{
              const elapsed = s.impStartTime ? (Date.now()-s.impStartTime)/1000 : 0;
              const fmt = (sec)=>{ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); };
              const pct = s.impTotal ? Math.round(s.impDone/s.impTotal*100) : 0;
              const etaSec = (s.impPhase==='import' && s.impDone>20) ? elapsed*(s.impTotal-s.impDone)/s.impDone : 0;
              return {
              labelStyle, setup:s.impStep==='setup', running:s.impStep==='running', review:s.impStep==='review',
              sheet:s.impSheet, root:s.impRoot, onSheet:(e)=>this.onImpSheet(e), onRoot:(e)=>this.onImpRoot(e), onStart:()=>this.startImport(),
              onBack:()=>this.goSettings(), onFinish:()=>{ if(s.impEnrich){ this.setState({enScope:'all'}); this.goEnrich('browse'); } else { this.goBrowse(); } }, onCancel:()=>this.cancelImport(),
              scanning:s.impPhase==='scan', importing:s.impPhase==='import', indeterminate:s.impPhase==='scan', percent:pct,
              stepScanActive:s.impPhase==='scan', stepScanDone:s.impPhase==='import', stepImportActive:s.impPhase==='import',
              importStepDotStyle:{display:'grid',placeItems:'center',width:'24px',height:'24px',borderRadius:'50%',fontFamily:'var(--font-sans)',fontSize:'12px',fontWeight:'700',background:s.impPhase==='import'?'var(--color-accent)':'var(--color-surface-3)',color:s.impPhase==='import'?'#14110d':'var(--color-text-faint)'},
              importStepLabelStyle:{fontFamily:'var(--font-sans)',fontSize:'14px',fontWeight:'600',color:s.impPhase==='import'?'var(--color-text)':'var(--color-text-faint)'},
              headline: s.impPhase==='scan' ? 'Scanning your library…' : 'Importing movies…',
              statLine: s.impPhase==='scan' ? ('Found '+s.impFound.toLocaleString()+' movies so far') : (s.impDone.toLocaleString()+' of '+s.impTotal.toLocaleString()+' imported'),
              currentItem:s.impCurrent, hasCurrent:!!s.impCurrent,
              elapsedLabel:'Elapsed '+fmt(elapsed), etaLabel: etaSec>0 ? ('About '+fmt(etaSec)+' left') : '', hasEta: etaSec>0,
              log:s.impLog,
              matched:s.impMatched, problemCount:s.impProblems.length, problems,
              enrich:s.impEnrich, onToggleEnrich:()=>this.toggleImpEnrich(),
              enrichCheck:s.impEnrich?'✓':'',
              enrichBoxStyle:{flex:'0 0 auto',display:'grid',placeItems:'center',width:'22px',height:'22px',marginTop:'1px',borderRadius:'6px',border:'2px solid '+(s.impEnrich?accent:'var(--color-text-faint)'),background:s.impEnrich?accent:'transparent',color:'#1a1109',fontSize:'14px',fontWeight:'700'},
              enrichHint:s.tmdbConnected?'Runs straight after the import, over everything it brings in. Needs the internet.':'Needs a TMDB key — add one under Settings → Network first.',
              hasProblems:s.impProblems.length>0, allResolved:s.impProblems.length===0,
              };
            })(),
            // series
            seriesModel:(()=>{
              const x=this.seriesById(s.seriesId); if(!x) return {seasons:[],genres:[]};
              const pr=this.seriesProgress(x.id); const nx=this.nextEpisodeOf(x.id);
              const isFav=s.seriesFavs.includes(x.id);
              return {
                title:x.title, genres:x.genres, synopsis:x.syn, creator:x.creator, castText:x.cast.join(', '),
                topTag:x.genres[0]+' \u00b7 Series', yearLabel:x.ye?(x.ys===x.ye?String(x.ys):x.ys+'\u2013'+x.ye):(x.ys+'\u2013'),
                countLabel:x.seasons.length+' season'+(x.seasons.length===1?'':'s')+' \u00b7 '+pr.total+' episodes',
                ratingPct:x.rating,
                posterStyle:{position:'absolute',inset:0,background:'linear-gradient(155deg, '+x.g1+' 0%, '+x.g2+' 100%)'},
                backdropStyle:{position:'absolute',inset:0,background:'linear-gradient(120deg, '+x.g1+' 0%, '+x.g2+' 100%)',filter:'blur(2px)',transform:'scale(1.05)'},
                playLabel: nx ? ((nx.progress>0?'Resume ':'Play ')+'S'+String(nx.season).padStart(2,'0')+'E'+String(nx.number).padStart(2,'0')) : 'Play',
                onPlayNext:()=>this.playEpisode(nx), onBack:()=>this.backFromSeries(),
                progressLabel: pr.watched===0 ? 'Not started' : pr.watched>=pr.total ? 'All '+pr.total+' episodes watched' : pr.watched+' of '+pr.total+' episodes watched',
                isFavorite:isFav, favTip:isFav?'In Favorites \u2014 click to remove':'Add to Favorites',
                onToggleFavorite:()=>this.toggleSeriesFav(x.id),
                favIconStyle:{display:'grid',placeItems:'center',width:'58px',height:'58px',flex:'0 0 auto',background:isFav?'var(--color-accent-soft)':'transparent',border:'1px solid '+(isFav?'var(--color-accent-line)':'var(--color-border)'),borderRadius:'50%',color:isFav?accent:'var(--color-text-dim)',cursor:'pointer'},
                seasons:x.seasons.map((count,i)=>{ const n=i+1; const eps=this.episodesOf(x.id,n);
                  return {card:{number:n,episodeCount:count,watchedCount:eps.filter(e=>e.watched).length,g1:x.g1,g2:x.g2},open:()=>this.openSeason(n)}; }),
              };
            })(),
            seasonModel:(()=>{
              const x=this.seriesById(s.seriesId); const n=s.seasonN;
              if(!x||!n) return {episodes:[],otherSeasons:[]};
              const eps=this.episodesOf(x.id,n);
              const w=eps.filter(e=>e.watched).length;
              const nx=eps.find(e=>e.progress>0&&e.progress<100)||eps.find(e=>!e.watched)||eps[0];
              const allW=eps.length>0&&eps.every(e=>e.watched);
              return {
                seriesTitle:x.title, seasonLabel:'Season '+n,
                countLabel:eps.length+' episodes', watchedLabel:w+' watched',
                playLabel: nx ? ((nx.progress>0?'Resume ':'Play ')+'E'+String(nx.number).padStart(2,'0')) : 'Play',
                onPlayNext:()=>this.playEpisode(nx), onBack:()=>this.backFromSeason(),
                toggleAllLabel: allW ? 'Mark season unwatched' : 'Mark season watched',
                onToggleAll:()=>this.toggleSeasonAll(),
                episodes:eps.map(e=>({data:{...e,resumeLabel:'Resume \u00b7 '+this.fmtClock(e.runtime*60*e.progress/100)+' of '+this.fmtClock(e.runtime*60)},
                  open:()=>this.playEpisode(e), toggleWatched:(ev)=>{ if(ev&&ev.stopPropagation)ev.stopPropagation(); this.toggleEpWatched(e); }})),
                hasOtherSeasons:x.seasons.length>1,
                otherSeasons:x.seasons.map((c,i)=>i+1).filter(i=>i!==n).map(i=>({label:'Season '+i,open:()=>this.openSeason(i)})),
              };
            })(),
            // enrichment
            enrichModel:(()=>{
              const elapsed = s.enStartTime ? (Date.now()-s.enStartTime)/1000 : 0;
              const fmt = (sec)=>{ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); };
              const pct = s.enTotal ? Math.round(s.enDone/s.enTotal*100) : 0;
              const etaSec = (s.enDone>2) ? elapsed*(s.enTotal-s.enDone)/s.enDone : 0;
              const missing = 12;
              const scopeDefs = s.enSingleTitle
                ? [['single','Just this movie',s.enSingleTitle]]
                : [['missing','Only what\u2019s missing',missing+' titles have no synopsis or artwork'],['all','Everything',this.rawMovies.length+' titles \u2014 re-checks ones already filled in']];
              const scopeCard=sel=>({flex:'1 1 260px',textAlign:'left',padding:'16px 18px',background:sel?'var(--color-accent-soft)':'var(--color-surface)',border:'1px solid '+(sel?'var(--color-accent-line)':'var(--color-border-soft)'),borderRadius:'var(--radius-md)',cursor:'pointer'});
              const scopeDot=sel=>({display:'block',width:'18px',height:'18px',flex:'0 0 auto',borderRadius:'99px',border:'2px solid '+(sel?accent:'var(--color-text-faint)'),background:sel?accent:'transparent',boxShadow:sel?'inset 0 0 0 3px var(--color-surface-2)':'none'});
              const ready = s.tmdbConnected && s.online;
              const pending = s.enPending.map(p=>{
                const col = p.kind==='ambiguous'?accent:p.kind==='conflict'?'#c9a86a':'#c97a6a';
                const choiceOf=(k)=>((p.choices||{})[k]||'tmdb');
                const sideStyle=(on)=>({flex:1,textAlign:'left',padding:'12px 14px',background:on?'var(--color-accent-soft)':'transparent',border:'none',borderLeft:'1px solid var(--color-border-soft)',boxShadow:on?'inset 0 0 0 1px var(--color-accent-line)':'none',cursor:'pointer'});
                return {
                  id:p.id, title:p.title, reason:p.reason, path:p.path, query:p.query||'',
                  isAmbiguous:p.kind==='ambiguous', isConflict:p.kind==='conflict', isMissing:p.kind==='missing',
                  dotStyle:{flex:'0 0 auto',width:'10px',height:'10px',marginTop:'7px',borderRadius:'99px',background:col},
                  onSkip:()=>this.skipEnrichRow(p.id), onSearch:()=>this.searchEnrich(p.id), onQuery:()=>{},
                  onApply:()=>this.applyConflict(p.id), onKeepAll:()=>this.skipEnrichRow(p.id),
                  candidates:(p.candidates||[]).map(c=>({
                    title:c.t, meta:c.y+' \u00b7 '+c.c, scoreLabel:c.s+'% match', onPick:()=>this.pickCandidate(p.id),
                    cardStyle:{flex:'0 0 auto',width:'132px',textAlign:'left',padding:'10px',background:'var(--color-surface-2)',border:'1px solid var(--color-border-soft)',borderRadius:'var(--radius-md)',cursor:'pointer'},
                    posterStyle:{display:'block',width:'100%',height:'160px',borderRadius:'8px',background:'linear-gradient(155deg, '+c.g1+' 0%, '+c.g2+' 100%)'},
                    scoreStyle:{display:'inline-block',marginTop:'8px',fontFamily:'var(--font-sans)',fontSize:'11px',fontWeight:'700',letterSpacing:'.3px',padding:'3px 8px',borderRadius:'var(--radius-pill)',color:c.s>70?'var(--color-watched)':'var(--color-text-faint)',background:c.s>70?'rgba(138,154,107,.16)':'var(--color-surface-3)'},
                  })),
                  fields:(p.fields||[]).map(f=>({
                    label:f.label, mine:f.mine, tmdb:f.tmdb,
                    onKeepMine:()=>this.setFieldChoice(p.id,f.key,'mine'), onUseTmdb:()=>this.setFieldChoice(p.id,f.key,'tmdb'),
                    mineStyle:sideStyle(choiceOf(f.key)==='mine'), tmdbStyle:sideStyle(choiceOf(f.key)==='tmdb'),
                  })),
                };
              });
              const targets = ['your library', s.enWriteSheet?'the sheet in your collection root':null, s.enWritePosters?'a poster.jpg in each movie folder':null].filter(Boolean);
              return {
                setup:s.enStep==='setup', running:s.enStep==='running', review:s.enStep==='review',
                onBack:()=>this.backFromEnrich(), onCancel:()=>this.cancelEnrich(), onRetry:()=>this.retryOnline(),
                onOpenKeySettings:()=>this.goSettings(), onStart:()=>this.startEnrich(),
                needsKey:!s.tmdbConnected, offline:!s.online,
                keyBadgeLabel:s.tmdbConnected?'TMDB connected':'No key yet',
                keyBadgeStyle:{flex:'0 0 auto',fontFamily:'var(--font-sans)',fontSize:'12px',fontWeight:'600',padding:'5px 12px',borderRadius:'var(--radius-pill)',color:s.tmdbConnected?'var(--color-watched)':'var(--color-text-faint)',background:s.tmdbConnected?'rgba(138,154,107,.16)':'var(--color-surface-3)',border:'1px solid '+(s.tmdbConnected?'rgba(138,154,107,.3)':'var(--color-border)')},
                scopes:scopeDefs.map(([v,label,desc])=>({label,desc,onSelect:()=>this.setEnrichScope(v),cardStyle:scopeCard(s.enScope===v),dotStyle:scopeDot(s.enScope===v)})),
                fields:this.enrichFieldDefs.map(f=>({label:f,on:!s.enFieldsOff.includes(f),toggle:()=>this.toggleEnrichField(f)})),
                writeSheet:s.enWriteSheet, onToggleSheet:()=>this.toggleEnrichSheet(),
                writePosters:s.enWritePosters, onTogglePosters:()=>this.toggleEnrichPosters(),
                writesToSource:s.enWriteSheet||s.enWritePosters,
                sheetPath:(s.impRoot||'E:\\Movies')+'\\familyflix-metadata.csv',
                posterPathExample:(s.impRoot||'E:\\Movies')+'\\<movie folder>\\poster.jpg',
                startLabel:s.enSingleTitle?'Fetch details':'Start sync',
                startVariant:ready?'primary':'secondary',
                startDisabled:!ready,
                estimateLabel: !s.online ? 'Waiting for a connection' : !s.tmdbConnected ? 'A key is needed before this can run' : 'About '+Math.max(1,Math.round(this.enrichTarget()*0.4))+'s for '+this.enrichTarget()+' title'+(this.enrichTarget()===1?'':'s'),
                headline:'Fetching from TMDB\u2026', indeterminate:false, percent:pct,
                statLine:s.enDone.toLocaleString()+' of '+s.enTotal.toLocaleString()+' looked up',
                currentItem:s.enCurrent, elapsedLabel:'Elapsed '+fmt(elapsed),
                etaLabel: etaSec>0 ? ('About '+fmt(etaSec)+' left') : '',
                log:s.enLog, matched:s.enMatched, pendingCount:s.enPending.length, pending,
                hasPending:s.enPending.length>0, allResolved:s.enPending.length===0,
                writtenSummary:'Saved to '+targets.join(', ')+'.',
                finishLabel:s.enReturn==='detail'?'Back to the movie':'Done',
                onFinish:()=>this.backFromEnrich(), onAgain:()=>this.setState({enStep:'setup'}),
              };
            })(),
            // export
            exportOpen:s.exportOpen,
            exportModel:{
              idle:!s.exportDone, done:s.exportDone,
              onClose:()=>this.closeExport(), stopProp:(e)=>this.stopProp(e),
              chooseCsv:()=>this.chooseCsv(), chooseXlsx:()=>this.chooseXlsx(), onExport:()=>this.runExport(),
              csvCardStyle:exCard(s.exportFormat==='csv'), xlsxCardStyle:exCard(s.exportFormat==='xlsx'),
              csvDotStyle:exDot(s.exportFormat==='csv'), xlsxDotStyle:exDot(s.exportFormat==='xlsx'),
              filename:'family-library.'+(s.exportFormat==='csv'?'csv':'xlsx'),
              rowLabel:this.rawMovies.length+' movies', columns:['Title','Year','Genres','Director','Cast','Rating','Status','Subtitles'],
              formatLabel:s.exportFormat==='csv'?'as CSV':'as Excel',
            },
          };
        }
      }
    </script>
  </body>
