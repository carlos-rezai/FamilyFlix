        </sc-if>

        <!-- ============================= DETAIL ============================= -->

          <dc-import
            name="page.MoviePage"
            detail="{{ detailModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"

        </sc-if>

        <!-- ============================= PLAYER ============================= -->
        <sc-if value="{{ isPlayer }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="feat.PlayerControls"
            p="{{ playerModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"

        <!-- ============================= ADD MOVIE ============================= -->

            name="feat.MovieForm"
            form="{{ formModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"

        </sc-if>

        <!-- ============================= IMPORT ============================= -->
        <sc-if value="{{ isImport }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="feat.ImportFlow"
            imp="{{ importModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= SERIES ============================= -->
        <sc-if value="{{ isSeries }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.SeriesPage"
            sr="{{ seriesModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= SEASON ============================= -->
        <sc-if value="{{ isSeason }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.SeasonPage"
            sn="{{ seasonModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= TMDB ENRICHMENT ============================= -->
        <sc-if value="{{ isEnrich }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="feat.EnrichmentFlow"
            en="{{ enrichModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= SETTINGS ============================= -->
        <sc-if value="{{ isSettings }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.SettingsPage"
            settings="{{ settingsModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= CODECS ============================= -->
        <sc-if value="{{ isCodecs }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.CodecsPage"
            cdc="{{ codecModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= LIBRARY FOLDERS ============================= -->
        <sc-if value="{{ isFolders }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.LibraryFoldersPage"
            lf="{{ foldersModel }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= MANAGE LIBRARY (design log 47) ============================= -->
        <sc-if value="{{ isManage }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="page.ManageLibraryPage"
            on-back="{{ onManageBack }}"
            style="position: absolute; inset: 0"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= EXPORT MODAL (feat.ExportModal) ============================= -->
        <sc-if value="{{ exportOpen }}" hint-placeholder-val="{{ false }}">
          <dc-import
            name="feat.ExportModal"
            data="{{ exportModel }}"
            style="position: absolute; inset: 0; z-index: 90"
            hint-size="100%,100%"
          ></dc-import>
        </sc-if>

        <!-- ============================= SNACKBAR HOST ============================= -->
        <sc-if value="{{ hasSnackbars }}" hint-placeholder-val="{{ false }}">
          <div
            style="
              position: absolute;
              right: 24px;
              bottom: 24px;
              z-index: 200;
              display: flex;
              flex-direction: column-reverse;
              gap: 12px;
              align-items: flex-end;
              pointer-events: none;
            "
          >
            <sc-for list="{{ snackbars }}" as="n" hint-placeholder-count="1">
              <div style="pointer-events: auto">
                <dc-import
                  name="mol.Snackbar"
                  variant="{{ n.variant }}"
                  title="{{ n.title }}"
                  message="{{ n.message }}"
                  action-label="{{ n.actionLabel }}"
                  on-action="{{ n.action }}"
                  dismissible="{{ n.dismissible }}"
                  on-dismiss="{{ n.onDismiss }}"
                  hint-size="360px,80px"
                ></dc-import>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>

                onFinish:()=>{ if(s.enReturn==='browse'){ this.setState({enStep:'setup'}); this.goBrowse(); } else { this.backFromEnrich(); } }, onAgain:()=>this.setState({enStep:'setup'}),
              };
            })(),
            // export
            exportOpen:s.exportOpen,
            exportModel:{
              idle:!s.exportDone, done:s.exportDone,
              onClose:()=>this.closeExport(), stopProp:(e)=>this.stopProp(e),
              chooseCsv:()=>this.chooseCsv(), chooseXlsx:()=>this.chooseXlsx(), onExport:()=>this.runExport(),
              csvCardStyle:exCard(s.exportFormat==='csv'), xlsxCardStyle:exCard(s.exportFormat==='xlsx'),
              csvDotStyle:exDot(s.exportFormat==='csv'), xlsxDotStyle:exDot(s.exportFormat==='xlsx'),
              filename:'family-library.'+(s.exportFormat==='csv'?'csv':'xlsx'),
              rowLabel:this.rawMovies.length+' movies', columns:['Title','Year','Genres','Director','Cast','Rating','Status','Subtitles'],
              formatLabel:s.exportFormat==='csv'?'as CSV':'as Excel',
            },
          };
        }
      }
    </script>
  </body>
</html>
