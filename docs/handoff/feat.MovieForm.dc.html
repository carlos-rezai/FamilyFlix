<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="stylesheet" href="tokens.css" />
      </helmet>
      <div
        data-screen-label="Add Movie"
        style="height: 100%; overflow-y: auto; background: var(--color-bg-2)"
      >
        <div
          style="
            max-width: 760px;
            margin: 0 auto;
            padding: var(--space-6) var(--space-6) var(--space-8);
          "
        >
          <sc-if
            value="{{ form.inImportContext }}"
            hint-placeholder-val="{{ false }}"
          >
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 16px;
                margin-bottom: 20px;
                background: var(--color-accent-soft);
                border: 1px solid var(--color-accent-line);
                border-radius: var(--radius-md);
                font-family: var(--font-sans);
                font-size: 14px;
                color: var(--color-text);
              "
            >
              <span style="color: var(--color-accent); font-weight: 600"
                >Resolving import</span
              ><span style="color: var(--color-text-dim)"
                >{{ form.resolveLabel }}</span
              >
            </div>
          </sc-if>

          <div
            style="
              display: flex;
              align-items: center;
              gap: 16px;
              margin-bottom: 8px;
            "
          >
            <dc-import
              name="prim.IconButton"
              icon="back"
              variant="outline"
              size="42"
              title="Back"
              on-click="{{ form.onBack }}"
              hint-size="42px,42px"
            ></dc-import>
            <h1
              style="
                font-family: var(--font-serif);
                font-weight: 600;
                font-size: 30px;
                color: var(--color-text);
                margin: 0;
              "
            >
              {{ form.heading }}
            </h1>
            <sc-if
              value="{{ form.showKindTabs }}"
              hint-placeholder-val="{{ true }}"
            >
              <div style="margin-left: auto">
                <dc-import
                  name="mol.PillTabs"
                  label="Kind"
                  options="{{ form.kindOptions }}"
                  value="{{ form.kind }}"
                  on-change="{{ form.onKind }}"
                  hint-size="196px,48px"
                ></dc-import>
              </div>
            </sc-if>
          </div>
          <p
            style="
              font-family: var(--font-sans);
              font-size: 15px;
              color: var(--color-text-faint);
              margin: 0 0 28px 58px;
            "
          >
            {{ form.lede }} To add many at once, use
            <span style="color: var(--color-text-dim); font-weight: 500"
              >Import library</span
            >.
          </p>

          <div style="display: flex; flex-direction: column; gap: 22px">
            <div style="display: flex; gap: 18px">
              <label style="flex: 1; display: block">
                <span style="{{ form.labelStyle }}">Title</span>
                <input
                  value="{{ form.title }}"
                  onInput="{{ form.onTitle }}"
                  placeholder="{{ form.titlePlaceholder }}"
                  style="{{ form.inputStyle }}"
                  style-focus="border-color:var(--color-accent-line)"
                />
              </label>
              <label style="flex: 0 0 150px; display: block">
                <span style="{{ form.labelStyle }}">Year</span>
                <input
                  value="{{ form.year }}"
                  onInput="{{ form.onYear }}"
                  placeholder="{{ form.yearPlaceholder }}"
                  style="{{ form.inputStyle }}"
                  style-focus="border-color:var(--color-accent-line)"
                />
              </label>
            </div>

            <div style="display: flex; gap: 18px">
              <label style="flex: 1; display: block">
                <span style="{{ form.labelStyle }}"
                  >{{ form.creditLabel }}</span
                >
                <input
                  value="{{ form.director }}"
                  onInput="{{ form.onDirector }}"
                  placeholder="{{ form.creditPlaceholder }}"
                  style="{{ form.inputStyle }}"
                  style-focus="border-color:var(--color-accent-line)"
                />
              </label>
              <label style="flex: 1; display: block">
                <span style="{{ form.labelStyle }}"
                  >Cast
                  <span style="color: var(--color-text-faint); font-weight: 400"
                    >(separate with commas)</span
                  ></span
                >
                <input
                  value="{{ form.cast }}"
                  onInput="{{ form.onCast }}"
                  placeholder="e.g. Jane Doe, John Roe"
                  style="{{ form.inputStyle }}"
                  style-focus="border-color:var(--color-accent-line)"
                />
              </label>
            </div>

            <label style="display: block">
              <span style="{{ form.labelStyle }}">Description</span>
              <dc-import
                name="prim.Textarea"
                value="{{ form.description }}"
                on-input="{{ form.onDescription }}"
                placeholder="{{ form.descriptionPlaceholder }}"
                min-height="96"
                hint-size="100%,96px"
              ></dc-import>
            </label>

            <div>
              <span style="{{ form.labelStyle }}"
                >Genre
                <span style="color: var(--color-text-faint); font-weight: 400"
                  >(pick one or more)</span
                ></span
              >
              <div
                style="
                  display: flex;
                  flex-wrap: wrap;
                  gap: 9px;
                  margin-top: 4px;
                "
              >
                <sc-for
                  list="{{ form.genreChips }}"
                  as="c"
                  hint-placeholder-count="12"
                >
                  <button onClick="{{ c.toggle }}" style="{{ c.style }}">
                    {{ c.label }}
                  </button>
                </sc-for>
              </div>
            </div>

            <div>
              <span style="{{ form.labelStyle }}"
                >Your rating
                <span style="color: var(--color-text-faint); font-weight: 400"
                  >(click a star or half a star)</span
                ></span
              >
              <div style="margin-top: 4px">
                <dc-import
                  name="mol.RatingPicker"
                  value="{{ form.rating }}"
                  on-change="{{ form.onRating }}"
                  hint-size="260px,40px"
                ></dc-import>
              </div>
            </div>

            <sc-if value="{{ form.isMovie }}" hint-placeholder-val="{{ true }}">
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 14px;
                  padding: 20px;
                  background: var(--color-surface);
                  border: 1px solid var(--color-border-soft);
                  border-radius: var(--radius-md);
                "
              >
                <div
                  style="
                    font-family: var(--font-sans);
                    font-size: 12px;
                    font-weight: 600;
                    letter-spacing: 0.8px;
                    text-transform: uppercase;
                    color: var(--color-text-faint);
                  "
                >
                  Files
                </div>

                <sc-if
                  value="{{ form.noFoundChoice }}"
                  hint-placeholder-val="{{ true }}"
                >
                  <dc-import
                    name="mol.FileField"
                    label="Video"
                    filename="{{ form.video }}"
                    choose-label="Choose video file"
                    icon="video"
                    on-pick="{{ form.pickVideo }}"
                    on-remove="{{ form.removeVideo }}"
                    hint-size="100%,42px"
                  ></dc-import>
                </sc-if>

                <!-- The Found-file choice: a Resolve whose folder holds two or more videos.
                     The folder's videos by name, a radio group, the first preselected; the
                     picker kept under them for a file from somewhere else, which joins the
                     group as its last option, chosen. One video or none: the FileField above. -->
                <sc-if
                  value="{{ form.hasFoundChoice }}"
                  hint-placeholder-val="{{ false }}"
                >
                  <div style="display: flex; gap: 12px">
                    <div
                      style="
                        flex: 0 0 70px;
                        font-family: var(--font-sans);
                        font-size: 14px;
                        color: var(--color-text-dim);
                        padding-top: 10px;
                      "
                    >
                      Video
                    </div>
                    <div
                      role="radiogroup"
                      aria-label="Video"
                      style="
                        flex: 1;
                        display: flex;
                        flex-direction: column;
                        gap: 8px;
                        min-width: 0;
                      "
                    >
                      <sc-for
                        list="{{ form.foundVideos }}"
                        as="fv"
                        hint-placeholder-count="2"
                      >
                        <button
                          role="radio"
                          aria-checked="{{ fv.selected }}"
                          onClick="{{ fv.choose }}"
                          style="{{ fv.rowStyle }}"
                          style-hover="border-color:var(--color-accent-line)"
                        >
                          <span style="{{ fv.dotStyle }}"></span>
                          <span
                            style="
                              flex: 1;
                              min-width: 0;
                              overflow: hidden;
                              text-overflow: ellipsis;
                              white-space: nowrap;
                              font-family: var(--font-mono);
                              font-size: 13px;
                              color: var(--color-text);
                            "
                            >{{ fv.name }}</span
                          >
                        </button>
                      </sc-for>
                      <button
                        onClick="{{ form.pickVideo }}"
                        style="
                          display: flex;
                          align-items: center;
                          justify-content: center;
                          gap: 6px;
                          height: 42px;
                          background: transparent;
                          border: 1px dashed var(--color-border);
                          border-radius: 8px;
                          color: var(--color-text-dim);
                          font-family: var(--font-sans);
                          font-size: 13px;
                          font-weight: 600;
                          cursor: pointer;
                        "
                        style-hover="border-color:var(--color-accent-line);color:var(--color-text)"
                      >
                        Choose video file
                      </button>
                    </div>
                  </div>
                </sc-if>
                <dc-import
                  name="mol.FileField"
                  label="Poster"
                  filename="{{ form.poster }}"
                  choose-label="Choose poster image"
                  icon="poster"
                  on-pick="{{ form.pickPoster }}"
                  on-remove="{{ form.removePoster }}"
                  hint-size="100%,42px"
                ></dc-import>

                <div style="display: flex; gap: 12px">
                  <div
                    style="
                      flex: 0 0 70px;
                      font-family: var(--font-sans);
                      font-size: 14px;
                      color: var(--color-text-dim);
                      padding-top: 10px;
                    "
                  >
                    Subtitles
                  </div>
                  <div
                    style="
                      flex: 1;
                      display: flex;
                      flex-direction: column;
                      gap: 8px;
                      min-width: 0;
                    "
                  >
                    <sc-for
                      list="{{ form.subtitles }}"
                      as="s"
                      hint-placeholder-count="2"
                    >
                      <dc-import
                        name="mol.SubtitleRow"
                        filename="{{ s.filename }}"
                        lang="{{ s.lang }}"
                        lang-options="{{ form.langOptions }}"
                        on-lang-change="{{ s.onLangChange }}"
                        on-remove="{{ s.remove }}"
                        hint-size="100%,48px"
                      ></dc-import>
                    </sc-for>
                    <button
                      onClick="{{ form.addSub }}"
                      style="
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 6px;
                        height: 42px;
                        background: transparent;
                        border: 1px dashed var(--color-border);
                        border-radius: 8px;
                        color: var(--color-text-dim);
                        font-family: var(--font-sans);
                        font-size: 13px;
                        font-weight: 600;
                        cursor: pointer;
                      "
                      style-hover="border-color:var(--color-accent-line);color:var(--color-text)"
                    >
                      ＋ Add subtitle file
                    </button>
                  </div>
                </div>
              </div>
            </sc-if>
            <sc-if
              value="{{ form.isSeries }}"
              hint-placeholder-val="{{ false }}"
            >
              <div
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 14px;
                  padding: 20px;
                  background: var(--color-surface);
                  border: 1px solid var(--color-border-soft);
                  border-radius: var(--radius-md);
                "
              >
                <div
                  style="
                    font-family: var(--font-sans);
                    font-size: 12px;
                    font-weight: 600;
                    letter-spacing: 0.8px;
                    text-transform: uppercase;
                    color: var(--color-text-faint);
                  "
                >
                  Files
                </div>

                <dc-import
                  name="mol.FileField"
                  label="Poster"
                  filename="{{ form.poster }}"
                  choose-label="Choose poster image"
                  icon="poster"
                  on-pick="{{ form.pickPoster }}"
                  on-remove="{{ form.removePoster }}"
                  hint-size="100%,42px"
                ></dc-import>

                <!-- Season posters: one slot per Season the episode rows hold, in season order, under
                     the series poster — mol.FileField, labelled S01, S02… A held poster travels as its
                     path, a picked one as bytes, and ✕ takes one away on save. An empty slot is the
                     dashed choose button. Drawn once the rows hold a season. -->
                <sc-if
                  value="{{ form.hasSeasonPosters }}"
                  hint-placeholder-val="{{ true }}"
                >
                  <div
                    role="group"
                    aria-labelledby="season-posters-label"
                    style="display: flex; flex-direction: column; gap: 8px"
                  >
                    <div
                      id="season-posters-label"
                      style="
                        padding-left: 82px;
                        font-family: var(--font-sans);
                        font-size: 13px;
                        color: var(--color-text-faint);
                      "
                    >
                      Season posters
                    </div>
                    <sc-for
                      list="{{ form.seasonPosters }}"
                      as="sp"
                      hint-placeholder-count="3"
                    >
                      <dc-import
                        name="mol.FileField"
                        label="{{ sp.label }}"
                        filename="{{ sp.filename }}"
                        choose-label="{{ sp.chooseLabel }}"
                        icon="poster"
                        on-pick="{{ sp.pick }}"
                        on-remove="{{ sp.remove }}"
                        hint-size="100%,42px"
                      ></dc-import>
                    </sc-for>
                  </div>
                </sc-if>

                <!-- The Show folder row (log 48): on the series add in the shell, once
                     ＋ Add show folder's pick has been read — mol.FileField's filled row,
                     labelled Show folder, the picked folder's absolute path in mono. Its ✕
                     takes off only the folder's rows; rows from ＋ Add episode files stay. -->
                <sc-if
                  value="{{ form.hasShowFolder }}"
                  hint-placeholder-val="{{ true }}"
                >
                  <dc-import
                    name="mol.FileField"
                    label="Show folder"
                    filename="{{ form.showFolder }}"
                    choose-label="Add show folder"
                    icon="file"
                    on-remove="{{ form.removeShowFolder }}"
                    hint-size="100%,42px"
                  ></dc-import>
                </sc-if>

                <div style="display: flex; gap: 12px">
                  <div
                    style="
                      flex: 0 0 70px;
                      font-family: var(--font-sans);
                      font-size: 14px;
                      color: var(--color-text-dim);
                      padding-top: 10px;
                    "
                  >
                    Episodes
                  </div>
                  <div
                    style="
                      flex: 1;
                      display: flex;
                      flex-direction: column;
                      gap: 8px;
                      min-width: 0;
                    "
                  >
                    <!-- One row per episode, in every series job. The mono line is the file:
                         on an add, the picked file's name; on the Series edit job, a held
                         episode's Source file (else its stored video's name), its ✕ removing
                         it on save; on the Series Resolve, the found file's path, its numbers
                         prefilled by the Numbering guess. -->
                    <sc-for
                      list="{{ form.episodes }}"
                      as="ep"
                      hint-placeholder-count="2"
                    >
                      <dc-import
                        name="mol.EpisodeFileRow"
                        filename="{{ ep.filename }}"
                        season="{{ ep.season }}"
                        number="{{ ep.number }}"
                        title="{{ ep.title }}"
                        on-season-change="{{ ep.onSeason }}"
                        on-number-change="{{ ep.onNumber }}"
                        on-title-change="{{ ep.onTitle }}"
                        on-remove="{{ ep.remove }}"
                        hint-size="100%,140px"
                      >
                        <sc-for
                          list="{{ ep.subtitles }}"
                          as="s"
                          hint-placeholder-count="1"
                        >
                          <dc-import
                            name="mol.SubtitleRow"
                            filename="{{ s.filename }}"
                            lang="{{ s.lang }}"
                            lang-options="{{ form.langOptions }}"
                            on-lang-change="{{ s.onLangChange }}"
                            on-remove="{{ s.remove }}"
                            hint-size="100%,48px"
                          ></dc-import>
                        </sc-for>
                        <button
                          onClick="{{ ep.addSub }}"
                          style="
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            gap: 6px;
                            height: 36px;
                            background: transparent;
                            border: 1px dashed var(--color-border);
                            border-radius: 8px;
                            color: var(--color-text-dim);
                            font-family: var(--font-sans);
                            font-size: 13px;
                            font-weight: 600;
                            cursor: pointer;
                          "
                          style-hover="border-color:var(--color-accent-line);color:var(--color-text)"
                        >
                          ＋ Add subtitle
                        </button>
                      </dc-import>
                    </sc-for>
                    <!-- ＋ Add show folder (log 48): the series add in the shell alone — a
                         browser has no folder dialog and draws none. It opens the one-folder
                         dialog; a cancel changes nothing. The read fills the Show folder row,
                         then one found row per episode, season then episode order, each with
                         its found subtitles, and an empty title takes the Title guess. -->
                    <sc-if
                      value="{{ form.canAddShowFolder }}"
                      hint-placeholder-val="{{ true }}"
                    >
                      <button
                        onClick="{{ form.addShowFolder }}"
                        style="
                          display: flex;
                          align-items: center;
                          justify-content: center;
                          gap: 6px;
                          height: 42px;
                          background: transparent;
                          border: 1px dashed var(--color-border);
                          border-radius: 8px;
                          color: var(--color-text-dim);
                          font-family: var(--font-sans);
                          font-size: 13px;
                          font-weight: 600;
                          cursor: pointer;
                        "
                        style-hover="border-color:var(--color-accent-line);color:var(--color-text)"
                      >
                        ＋ Add show folder
                      </button>
                    </sc-if>
                    <button
                      onClick="{{ form.addEpisodeFiles }}"
                      style="
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 6px;
                        height: 42px;
                        background: transparent;
                        border: 1px dashed var(--color-border);
                        border-radius: 8px;
                        color: var(--color-text-dim);
                        font-family: var(--font-sans);
                        font-size: 13px;
                        font-weight: 600;
                        cursor: pointer;
                      "
                      style-hover="border-color:var(--color-accent-line);color:var(--color-text)"
                    >
                      ＋ Add episode files
                    </button>
                  </div>
                </div>
              </div>
            </sc-if>
          </div>

          <!-- The Import mode (log 48), ImportModeChoice: the shell's plain add alone, movie
               and series — never an edit, a Resolve or a browser — under the Files card, before
               the TMDB check. Link chosen on every visit, never remembered; posted first as
               `mode`. A show, or a movie's picked video (read through the Path bridge and
               checked with the containing read the moment it is picked), under no Library
               folder disables the Link card, reading its line, and Copy stands chosen until a
               later pick under one. In Link the movie's video travels as its path; in Copy as
               its bytes. -->
          <sc-if
            value="{{ form.showImportMode }}"
            hint-placeholder-val="{{ true }}"
          >
            <div style="margin-top: 24px">
              <span style="{{ form.groupHeadingStyle }}" id="form-mode-caption"
                >Files</span
              >
              <div
                role="radiogroup"
                aria-labelledby="form-mode-caption"
                style="display: flex; gap: 10px"
              >
                <sc-for
                  list="{{ form.modes }}"
                  as="m"
                  hint-placeholder-count="2"
                >
                  <button
                    role="radio"
                    aria-checked="{{ m.checked }}"
                    disabled="{{ m.disabled }}"
                    onClick="{{ m.onSelect }}"
                    style="{{ m.cardStyle }}"
                  >
                    <div
                      style="
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                      "
                    >
                      <span
                        style="
                          font-family: var(--font-sans);
                          font-size: 16px;
                          font-weight: 600;
                          color: var(--color-text);
                        "
                        >{{ m.label }}</span
                      ><span style="{{ m.dotStyle }}"></span>
                    </div>
                    <div
                      style="
                        font-family: var(--font-sans);
                        font-size: 12.5px;
                        color: var(--color-text-faint);
                        margin-top: 4px;
                        text-align: left;
                      "
                    >
                      {{ m.line }}
                    </div>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-if>

          <!-- Add and sync: on a plain add alone, both kinds, between the Files card and the
               actions — never on an edit or a Resolve. Off on every mount; Add to library keeps
               its label. Ticked, the save lands on the title's page with the Enrichment flow
               pushed over it, Started on arrival. -->
          <sc-if
            value="{{ form.showEnrich }}"
            hint-placeholder-val="{{ true }}"
          >
            <div style="margin-top: 24px">
              <dc-import
                name="mol.EnrichCheckCard"
                checked="{{ form.enrich }}"
                key-set="{{ form.keySet }}"
                keyed-hint="{{ form.keyedHint }}"
                on-toggle="{{ form.onToggleEnrich }}"
                hint-size="100%,74px"
              ></dc-import>
            </div>
          </sc-if>

          <div
            style="
              display: flex;
              align-items: center;
              gap: 14px;
              margin-top: 32px;
            "
          >
            <dc-import
              name="prim.Button"
              label="{{ form.saveLabel }}"
              variant="primary"
              size="md"
              icon="none"
              on-click="{{ form.onSave }}"
              hint-size="160px,50px"
            ></dc-import>
            <dc-import
              name="prim.Button"
              label="{{ form.cancelLabel }}"
              variant="secondary"
              size="md"
              icon="none"
              on-click="{{ form.onBack }}"
              hint-size="120px,50px"
            ></dc-import>
          </div>

          <!-- A refused Show folder pick (log 48), under the buttons: one 13px danger line —
               “That folder can’t be read.” or “There are no videos in that folder.” It adds no
               rows. -->
          <sc-if
            value="{{ form.showFolderRefusal }}"
            hint-placeholder-val="{{ false }}"
          >
            <p
              style="
                margin: 12px 0 0;
                font-family: var(--font-sans);
                font-size: 13px;
                color: var(--color-danger);
              "
            >
              {{ form.showFolderRefusal }}
            </p>
          </sc-if>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":820,"height":700},"form":{"editor":null,"tsType":"MovieFormModel"}}'
    ></script>
  </body>
</html>
