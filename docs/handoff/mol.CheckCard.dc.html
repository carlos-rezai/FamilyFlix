<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="stylesheet" href="tokens.css" />
      </helmet>
      <!-- A ticked option as a card, graduated from the TMDB box when the Library folders page
           drew a second one above it (Scan every folder again). A real checkbox in the tab order,
           clipped, under the drawn box; the label and the hint are the caller's. It holds
           nothing; a press reports. -->
      <label
        style="
          display: flex;
          align-items: flex-start;
          gap: 12px;
          padding: 14px 16px;
          background: var(--color-surface);
          border: 1px solid var(--color-border-soft);
          border-radius: 10px;
          cursor: pointer;
          margin-top: 4px;
        "
      >
        <span style="{{ boxStyle }}">{{ check }}</span>
        <input
          type="checkbox"
          checked="{{ checked }}"
          onChange="{{ onToggle }}"
          style="position: absolute; opacity: 0; width: 0; height: 0"
        />
        <span style="flex: 1; min-width: 0">
          <span
            style="
              display: block;
              font-family: var(--font-sans);
              font-size: 15px;
              font-weight: 600;
              color: var(--color-text);
            "
            >{{ label }}</span
          >
          <span
            style="
              display: block;
              font-family: var(--font-sans);
              font-size: 13px;
              color: var(--color-text-faint);
              margin-top: 2px;
              line-height: 1.45;
              text-wrap: pretty;
            "
            >{{ hint }}</span
          >
        </span>
      </label>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":640,"height":120},"checked":{"editor":"boolean","default":false,"tsType":"boolean"},"label":{"editor":"text","default":"Scan every folder again","tsType":"string"},"hint":{"editor":"text","default":"Reads the folders already scanned too, for files added or changed since. Nothing already in the library is imported twice.","tsType":"string"},"onToggle":{"editor":null,"tsType":"() =&gt; void"}}'
    >
      class Component extends DCLogic {
        renderVals(){
          const on=!!this.props.checked;
          return {
            checked:on, check:on?'✓':'',
            boxStyle:{flex:'0 0 auto',display:'grid',placeItems:'center',width:'22px',height:'22px',marginTop:'1px',borderRadius:'6px',border:'2px solid '+(on?'var(--color-accent)':'var(--color-text-faint)'),background:on?'var(--color-accent)':'transparent',color:'#1a1109',fontSize:'14px',fontWeight:'700'},
            label:this.props.label||'', hint:this.props.hint||'',
            onToggle:()=>{ if(this.props.onToggle) this.props.onToggle(); },
          };
        }
      }
    </script>
  </body>
</html>
