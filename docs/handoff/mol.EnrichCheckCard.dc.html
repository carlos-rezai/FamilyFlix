<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="stylesheet" href="tokens.css" />
      </helmet>
      <!-- The Also fetch from TMDB box, graduated when the Movie form drew it beside Import
           setup and the Library folders page: mol.CheckCard with its label fixed. The hint
           while a key is stored is the caller's (keyedHint): the
           import's "Runs straight after the import…", the form's "Runs straight after the
           save…". The key-less hint is the card's own. It holds nothing; a press reports. -->
      <dc-import
        name="mol.CheckCard"
        checked="{{ checked }}"
        label="Also fetch metadata and posters from TMDB"
        hint="{{ hint }}"
        on-toggle="{{ onToggle }}"
        hint-size="100%,74px"
      ></dc-import>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":640,"height":120},"checked":{"editor":"boolean","default":false,"tsType":"boolean"},"keySet":{"editor":"boolean","default":true,"tsType":"boolean"},"keyedHint":{"editor":"text","default":"Runs straight after the import, over everything it brings in. Needs the internet.","tsType":"string"},"onToggle":{"editor":null,"tsType":"() =&gt; void"}}'
    >
      class Component extends DCLogic {
        renderVals(){
          const on=!!this.props.checked;
          const keySet=this.props.keySet!==false;
          return {
            checked:on,
            // The keyed hint is the caller's; the key-less one is the card's own.
            hint:keySet?(this.props.keyedHint||'Runs straight after the import, over everything it brings in. Needs the internet.'):'Needs a TMDB key. Add one under Settings → Network first.',
            onToggle:()=>{ if(this.props.onToggle) this.props.onToggle(); },
          };
        }
      }
    </script>
  </body>
</html>
