<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="stylesheet" href="tokens.css" />
      </helmet>
      <div
        role="group"
        aria-label="{{ label }}"
        style="
          flex: 0 0 auto;
          display: flex;
          gap: 4px;
          padding: 4px;
          background: var(--color-surface);
          border: 1px solid var(--color-border-soft);
          border-radius: var(--radius-pill);
        "
      >
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2"
          ><button
            onClick="{{ t.press }}"
            aria-pressed="{{ t.pressed }}"
            style="{{ t.style }}"
          >
            {{ t.label }}
          </button></sc-for
        >
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":260,"height":56},"label":{"editor":"text","default":"Library","tsType":"string"},"options":{"editor":null,"tsType":"{ value: string; label: string }[]"},"value":{"editor":"text","default":"movies","tsType":"string"},"onChange":{"editor":null,"tsType":"(value: string) =&gt; void"}}'
    >
      class Component extends DCLogic {
        renderVals(){
          const options=this.props.options||[{value:'movies',label:'Movies'},{value:'series',label:'Series'}];
          const value=this.props.value||options[0].value;
          const tabStyle=on=>({height:'38px',padding:'0 20px',background:on?'var(--color-accent)':'transparent',border:'none',borderRadius:'var(--radius-pill)',color:on?'#1a1109':'var(--color-text-faint)',fontFamily:'var(--font-sans)',fontSize:'15px',fontWeight:on?'700':'500',cursor:'pointer'});
          return {
            label:this.props.label||'Tabs',
            tabs:options.map(o=>({label:o.label, pressed:String(o.value===value), style:tabStyle(o.value===value),
              press:()=>{ if(this.props.onChange) this.props.onChange(o.value); }})),
          };
        }
      }
    </script>
  </body>
</html>
